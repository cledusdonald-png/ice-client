org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false

# NOTE: ForgeGradle 2.1 / MC 1.8.9 must build on JDK 8. Set JAVA_HOME to a JDK 8
# before running gradlew -- setting org.gradle.java.home here is not enough,
# because the wrapper launcher itself runs on PATH-java and Gradle 2.14 cannot
# parse a Java 9+ version string.

mod_id=iceclient
mod_group=com.iceclient
mod_name=Ice Client
# Bump this every time you ship a jar. The launcher's version.json must name the
# jar exactly as it comes out of build/libs, so this number IS the shipped version.
mod_version=3.0.0
